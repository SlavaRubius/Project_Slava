<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>catalog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
   
    <div class="panel">
        <input type="text" id="search" placeholder="найти игру..."> 
        <button class="btn" id="active">Все</button>
        <button class="btn">MMO</button>
        <button class="btn">Шутеры</button>
        <button class="btn">Экшен</button>
        <button class="btn">симуляторы</button>
        <button class="btn">RP Проекты</button>
    </div>


    <div class="catalog">
        
        <div class="card">
            <img src="https://placeholder.com" alt="WoW">
            <h3>World of Warcraft</h3>
            <p>1200+ предложений</p>
            <a href="#"class="btn">Открыть</a>
        </div>


        <div class="card">
            <img src="https://placeholder.com" alt="CS2">
            <h3>Counter-Strike 2</h3>
            <p>800+ предложений</p>
            <a href="#" class="btn">Открыть</a>
        </div>

        
        <div class="card">
            <img src="https://placeholder.com" alt="L2">
            <h3>Lineage 2</h3>
            <p>400+ предложений</p>
            <a href="#" class="btn">Открыть</a>
        </div>


        <div class="card">
            <img src="https://placeholder.com" alt="Dota2">
            <h3>Dota 2</h3>
            <p>1500+ предложений</p>
            <a href="#" class="btn">Открыть</a>
        </div>

        <div class="card">
            <img src="https://placeholder.com" alt="Arizona">
            <h3>Arizona RP</h3>
            <p>2635+ предложений</p>
            <a href="#" class="btn">Открыть</a>
        </div>

        <div class="card">
            <img src="https://placeholder.com" alt="Dota2">
            <h3>Drag Racing:<br>Уличные гонки</h3>
            <p>650+ предложений</p>
            <a href="#" class="btn">Открыть</a>
        </div>
    </div>

        

</body>
</html>
